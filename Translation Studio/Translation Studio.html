document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3e7ef718-7509-4b8c-b524-6990d812cd25\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"584376a0-de2b-410d-9075-5ce9e9ee045f\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"efbcc647-6f38-402f-9886-e066e653189b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"76c5122e-f9d6-4718-ba16-73fcc19e17a2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"742c94e0-ce3d-4450-a9b6-63c6b4d89839\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"09673b86-2acd-42d5-8cdb-f86e535c2977\") format('woff2');\n  unicode-range: U+03 woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* \u2500\u2500 DM Sans Variable \u2014 single file, all weights & optical sizes \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n@font-face {\n  font-family: 'DM Sans';\n  src: url(\"d0e11e16-2516-4723-9c12-00f65b74f8ba\") format('truetype');\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n\n  /* ===== BACKGROUNDS ===================================================== */\n  /* From Figma Foundations \u2192 Colors \u2192 \"Background\" frame */\n  --bg-default:       #FFFFFF;   /* Default surface \u2014 most containers */\n  --bg-alternative:   #FFFFFF;   /* Side sheets, cards, full-screen modals */\n  --bg-highlight:     #F7F9FA;   /* Wrapper tint for emphasis inside surfaces */\n  --bg-app:           #FBFCFD;   /* Root app background */\n\n  /* Status backgrounds */\n  --bg-success:       #E8F6E5;   /* Success feedback components */\n  --bg-warning:       #FFF9E3;   /* Warning feedback components */\n  --bg-critical:      #FCE0E0;   /* Critical feedback components */\n  --bg-advice:        #EFE7FE;   /* Advice / recommendation components */\n\n  /* Interactive backgrounds */\n  --bg-active:        #EBEEF4;   /* Active state for interactive elements (web) */\n  --bg-disabled:      #F3F5F6;   /* Disabled state for interactive elements (web) */\n\n  /* Extras */\n  --bg-overlay:       rgba(115,118,119,0.7); /* Scrim behind side sheets / modals */\n  --bg-skeleton:      #EDEFF0;   /* Skeleton loading animation background */\n\n\n  /* ===== CONTENT (Text & Icons) ========================================= */\n  /* From Figma Foundations \u2192 Colors \u2192 \"Content (Text and icons)\" frame */\n  --fg-high:          #1F2223;   /* Highest relevance: primary headings, labels */\n  --fg-medium:        #404344;   /* Medium relevance: paragraphs, descriptions, table cells */\n  --fg-low:           #737677;   /* Low relevance: helper texts, T&Cs */\n  --fg-disabled:      #9C9FA0;   /* Disabled content over background */\n  --fg-success:       #356D29;   /* Content over --bg-success */\n  --fg-warning:       #483C10;   /* Content over --bg-warning */\n  --fg-critical:      #B00020;   /* Content over --bg-critical; also delete/error actions */\n  --fg-advice:        #663DB0;   /* Content over --bg-advice */\n\n\n  /* ===== BORDERS ========================================================= */\n  /* From Figma Foundations \u2192 Colors \u2192 \"Border\" frame */\n  --border-default:   #DFE1E2;   /* Dividers, table borders, grouping borders */\n  --border-interactive: #BBBEBF; /* Inputs, selectors, interactive border elements */\n  --border-critical:  #B00020;   /* Error state of inputs; critical interactive elements */\n  --border-success:   #356D29;   /* Success/approval state of interactive elements */\n  --border-hover:     #737677;   /* Hover state of interactive elements */\n  --border-disabled:  #EDEFF0;   /* Disabled state of interactive elements */\n\n\n  /* ===== PRIMARY ========================================================= */\n  /* From Figma Foundations \u2192 Colors \u2192 \"Primary\" frame */\n  --primary-default:  #335894;   /* Primary actions \u2014 login button, primary CTA */\n  --primary-hover:    #294676;   /* Hover state of primary elements */\n  --primary-active:   #1F3559;   /* Active/pressed state */\n  --primary-outline:  #859BBF;   /* Focus ring / outline for primary components */\n  --primary-disabled: #F3F5F6;   /* Background for disabled state */\n\n  /* Content on Primary (text & icons over dark/primary backgrounds) */\n  --on-primary-high:  #FFFFFF;   /* Highest relevance over primary dark bg */\n  --on-primary-low:   #C0C7D3;   /* Low relevance content over dark components */\n  --on-primary-dis:   #9C9FA0;   /* Over primary disabled background only */\n\n  /* Sidenav (referenced in MUI equivalence) */\n  --sidenav-bg:       #1F304B;   /* Sidenav default surface */\n  --sidenav-hover:    #121B2B;   /* Sidenav hover state */\n\n\n  /* ===== COMPLEMENTARY ================================================== */\n  /* From Figma Foundations \u2192 Colors \u2192 \"Complementary\" frame */\n  --comp-accent:      #DBFFDD;   /* \u2014 (reserved accent, no current semantic mapping) */\n  --comp-link:        #1959D2;   /* Interactive text links and text buttons only */\n\n\n  /* ===== EXTRAS ========================================================== */\n  /* From Figma Foundations \u2192 Colors \u2192 \"Extras\" frame */\n  --extra-enterprise: #1F304B;   /* Enterprise badge */\n\n\n  /* ===== NEUTRALS (reference scale) ====================================== */\n  /* Not a named token group in Foundations, but useful for building components */\n  --neutral-0:   #FFFFFF;\n  --neutral-50:  #FBFCFD;\n  --neutral-75:  #F7F9FA;\n  --neutral-100: #F3F5F6;\n  --neutral-150: #EDEFF0;\n  --neutral-200: #DFE1E2;\n  --neutral-300: #BBBEBF;\n  --neutral-400: #9C9FA0;\n  --neutral-500: #737677;\n  --neutral-600: #5F6263;   /* Shadow color base (rgb 95,98,99) */\n  --neutral-700: #404344;\n  --neutral-900: #1F2223;\n\n\n  /* ===== SHADOWS ========================================================= */\n  /* From Figma Foundations \u2192 Elevations \u2192 \"Shadows specs\" frame.\n     The system uses DIRECTIONAL shadows based on screen position.\n     Shadow tint: rgba(95,98,99,*) \u2014 NOT rgba(64,67,68,*).         */\n\n  /* Centered \u2014 menus, dropdowns, modals positioned in center of screen */\n  --shadow-centered-low:    0 4px   8px rgba(95,98,99,0.20); /* First elevation: emergent menus, dropdowns */\n  --shadow-centered-med:    0 8px  16px rgba(95,98,99,0.15); /* Second elevation: modals, carousel buttons */\n\n  /* Right \u2014 side sheets, chat panels positioned on right of screen */\n  --shadow-right-low:       4px  4px  8px rgba(95,98,99,0.20); /* First elevation: right-side dropdowns */\n  --shadow-right-med:       8px  8px 16px rgba(95,98,99,0.15); /* Second elevation: side sheets, chat */\n\n  /* Left \u2014 snackbars, components positioned on left of screen */\n  --shadow-left-med:       -8px  8px 16px rgba(95,98,99,0.15); /* Second elevation: modals, left carousel buttons */\n  --shadow-left-high-ok:  -16px 16px 24px rgba(53,109,41,0.10); /* Snackbar \u2014 success variant */\n  --shadow-left-high-warn:-16px 16px 24px rgba(72,60,16,0.10);  /* Snackbar \u2014 warning variant */\n  --shadow-left-high-err: -16px 16px 24px rgba(176,0,32,0.10);  /* Snackbar \u2014 critical variant */\n  --shadow-left-high-info:-16px 16px 24px rgba(36,78,176,0.10); /* Snackbar \u2014 info variant */\n\n  /* Rule: use shadow for elements ON TOP of something (dropdowns, snackbars).\n     For cards and flat containers, use borders \u2014 never combine shadow + border. */\n\n\n  /* ===== TYPOGRAPHY ====================================================== */\n  /* From Figma Foundations \u2192 Typography frame.\n     Font: DM Sans exclusively for product. Root = 16px.             */\n  /* Single variable font \u2014 use font-variation-settings: 'opsz' N per role */\n  --font-sans:  'DM Sans', sans-serif;  /* all roles \u2014 weight + opsz via variation-settings */\n  --font-alt:   'Inter',   sans-serif;  /* rare: docs / marketing only */\n  --font-mono:  ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* opsz values to pass as font-variation-settings (axis range: 9\u201340) */\n  --opsz-body:   9;   /* @kind font */ /* 12\u201316px body, button, caption */\n  --opsz-sub2:  18;   /* @kind font */ /* Subtitle 2 \u2014 18px */\n  --opsz-sub1:  24;   /* @kind font */ /* Subtitle 1, H3, H4 \u2014 20\u201324px */\n  --opsz-h1:    36;   /* @kind font */ /* H1, H2 \u2014 28\u201336px */\n\n  /* Heading scale */\n  --type-h1-size: 36px; --type-h1-lh: 48px; --type-h1-weight: 600; --type-h1-ls: -0.021em;\n  --type-h2-size: 28px; --type-h2-lh: 40px; --type-h2-weight: 600; --type-h2-ls: -0.020em;\n  --type-h3-size: 24px; --type-h3-lh: 36px; --type-h3-weight: 600; --type-h3-ls: -0.017em;\n\n  /* Subheading scale */\n  --type-sub1-size: 20px; --type-sub1-lh: 32px; --type-sub1-weight: 600; --type-sub1-ls: -0.016em;\n  --type-sub2-size: 18px; --type-sub2-lh: 24px; --type-sub2-weight: 700; --type-sub2-ls: -0.014em;\n\n  /* Body scale */\n  --type-button-size: 16px; --type-button-lh: 24px; --type-button-weight: 500; --type-button-ls: -0.011em;\n  --type-body1-size:  16px; --type-body1-lh:  24px; --type-body1-weight: 400; --type-body1-ls: -0.011em;\n  --type-body1b-weight: 600; /* Bold variant of Body 1 */\n  --type-body2-size:  14px; --type-body2-lh:  22px; --type-body2-weight: 400; --type-body2-ls: -0.006em;\n  --type-body2b-weight: 600; /* Bold variant of Body 2 */\n  --type-caption-size: 12px; --type-caption-lh: 16px; --type-caption-weight: 400; --type-caption-ls: 0em;\n\n\n  /* ===== SPACING ========================================================= */\n  /* From Figma Foundations \u2192 Layout \u2192 Spacing. Base: 8px. */\n  --space-4:   4px;\n  --space-8:   8px;\n  --space-16:  16px;\n  --space-24:  24px;\n  --space-32:  32px;\n  --space-40:  40px;\n  --space-48:  48px;\n  --space-56:  56px;\n  --space-64:  64px;\n  --space-72:  72px;\n  --space-80:  80px;\n  --space-88:  88px;\n  --space-96:  96px;\n  --space-104: 104px;\n  --space-112: 112px;\n  --space-120: 120px;\n\n  /* Breakpoints (referenced \u2014 use in CSS @media, not as custom props) */\n  /* SM:  320px \u2013 639px   (Mobile small)         */\n  /* MD:  640px \u2013 767px   (Mobile large)          */\n  /* MD:  768px \u2013 1023px  (Tablet)                */\n  /* LG: 1024px \u2013 1439px  (Desktop small)         */\n  /* XL: +1440px          (Desktop large)         */\n\n  /* Border radii (from component patterns \u2014 not a dedicated Foundations page) */\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   8px;   /* Default \u2014 buttons, inputs, cards */\n  --radius-lg:   12px;\n  --radius-xl:   16px;\n  --radius-pill: 999px;\n\n  /* Motion (MUI standard, ~200ms) */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --dur-base: 200ms; /* @kind other */\n}\n\n\n/* =========================================================================\n   SEMANTIC TYPOGRAPHY CLASSES\n   ========================================================================= */\n\n.type-h1 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-h1);\n  font-weight: var(--type-h1-weight);\n  font-size: var(--type-h1-size);\n  line-height: var(--type-h1-lh);\n  letter-spacing: var(--type-h1-ls);\n  color: var(--fg-high);\n}\n.type-h2 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-h1);\n  font-weight: var(--type-h2-weight);\n  font-size: var(--type-h2-size);\n  line-height: var(--type-h2-lh);\n  letter-spacing: var(--type-h2-ls);\n  color: var(--fg-high);\n}\n.type-h3 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-sub1);\n  font-weight: var(--type-h3-weight);\n  font-size: var(--type-h3-size);\n  line-height: var(--type-h3-lh);\n  letter-spacing: var(--type-h3-ls);\n  color: var(--fg-high);\n}\n.type-sub1 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-sub1);\n  font-weight: var(--type-sub1-weight);\n  font-size: var(--type-sub1-size);\n  line-height: var(--type-sub1-lh);\n  letter-spacing: var(--type-sub1-ls);\n  color: var(--fg-high);\n}\n.type-sub2 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-sub2);\n  font-weight: var(--type-sub2-weight);\n  font-size: var(--type-sub2-size);\n  line-height: var(--type-sub2-lh);\n  letter-spacing: var(--type-sub2-ls);\n  color: var(--fg-high);\n}\n.type-button {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-body);\n  font-weight: var(--type-button-weight);\n  font-size: var(--type-button-size);\n  line-height: var(--type-button-lh);\n  letter-spacing: var(--type-button-ls);\n}\n.type-body1 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-body);\n  font-weight: var(--type-body1-weight);\n  font-size: var(--type-body1-size);\n  line-height: var(--type-body1-lh);\n  letter-spacing: var(--type-body1-ls);\n  color: var(--fg-high);\n}\n.type-body1-bold {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-body);\n  font-weight: var(--type-body1b-weight);\n  font-size: var(--type-body1-size);\n  line-height: var(--type-body1-lh);\n  letter-spacing: var(--type-body1-ls);\n  color: var(--fg-high);\n}\n.type-body2 {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-body);\n  font-weight: var(--type-body2-weight);\n  font-size: var(--type-body2-size);\n  line-height: var(--type-body2-lh);\n  letter-spacing: var(--type-body2-ls);\n  color: var(--fg-medium);\n}\n.type-body2-bold {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-body);\n  font-weight: var(--type-body2b-weight);\n  font-size: var(--type-body2-size);\n  line-height: var(--type-body2-lh);\n  letter-spacing: var(--type-body2-ls);\n  color: var(--fg-high);\n}\n.type-caption {\n  font-family: var(--font-sans);\n  font-variation-settings: 'opsz' var(--opsz-body);\n  font-weight: var(--type-caption-weight);\n  font-size: var(--type-caption-size);\n  line-height: var(--type-caption-lh);\n  letter-spacing: var(--type-caption-ls);\n  color: var(--fg-low);\n}\n.type-link {\n  color: var(--comp-link);\n  font-weight: 500;\n  text-decoration: none;\n}\n.type-link:hover { text-decoration: underline; }\n\n/* Base class for product surfaces */\n.clara-root {\n  font-family: var(--font-sans);\n  font-size: var(--type-body1-size);\n  line-height: var(--type-body1-lh);\n  letter-spacing: var(--type-body1-ls);\n  color: var(--fg-high);\n  background: var(--bg-app);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* \u2500\u2500 Tool-level tokens. Every value used in the markup below resolves through\n     var(). Clara tokens come from colors_and_type.css; the --ts-* layer only\n     adds things Clara has no token for (shell metrics, table density, the\n     documented dark-nav white overlays). No raw hex anywhere in the markup. \u2500\u2500 */\n:root{\n  /* shell */\n  --ts-nav-w: 232px;\n  --ts-nav-rail: 56px;\n  --ts-topbar-h: 48px;\n  --ts-pad-x: 24px;\n  --ts-pad-y: 20px;\n  /* table density \u2014 tightened vs Clara's customer-facing defaults */\n  --ts-row-h: 40px;\n  --ts-head-h: 34px;   /* DS data table is 40px \u2014 tightened, per the density brief */\n  --ts-cols: 3fr 1fr 1fr 1fr 1fr 1fr;\n  /* dark nav overlays \u2014 DS README: sidenav hover/active are white 8% / 14% */\n  --ts-nav-hover: rgba(255,255,255,.08);\n  --ts-nav-active: rgba(255,255,255,.14);\n  --ts-nav-label: rgba(255,255,255,.48);\n  --ts-nav-fg: rgba(255,255,255,.78);\n  --ts-nav-rule: rgba(255,255,255,.10);\n  /* connection dots */\n  --ts-dot-ok: var(--border-success);\n  --ts-dot-idle: var(--fg-disabled);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--bg-app);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;border:0;background:none;padding:0}\ninput{font:inherit}\na{color:var(--comp-link);text-decoration:none}\na:hover{text-decoration:underline}\n\n/* =========================================================================\n   Initiatives table \u2014 shared by \"Latest initiatives\" (My projects) and\n   \"Initiatives\" (Folder detail) so both stay visually identical. Reuse for\n   any future table on the same grid (e.g. a review table) instead of\n   copy-pasting the inline styles again. Source: Assets/initiatives-table.css\n   ========================================================================= */\n.ts-toolbar{display:flex;align-items:center;gap:var(--space-8);min-height:32px}\n.ts-toolbar-title{margin:0;font-size:var(--type-body1-size);line-height:var(--type-body1-lh);font-weight:var(--type-body1b-weight);letter-spacing:var(--type-body1-ls);color:var(--fg-high)}\n.ts-toolbar-count{font-size:var(--type-caption-size);line-height:var(--type-caption-lh);color:var(--fg-low)}\n.ts-spacer{flex:1 1 auto}\n.ts-search{display:flex;align-items:center;gap:8px;height:32px;width:260px;padding:0 10px;background:var(--bg-default);border:1px solid var(--border-default);border-radius:var(--radius-md)}\n.ts-search-icon{display:block;flex:0 0 auto}\n.ts-search-input{flex:1 1 auto;min-width:0;border:0;outline:0;background:transparent;font-size:var(--type-body2-size);line-height:var(--type-body2-lh);letter-spacing:var(--type-body2-ls);color:var(--fg-high)}\n.ts-tbl{display:flex;flex-direction:column;width:100%}\n.ts-tbl-head{display:grid;grid-template-columns:var(--ts-cols);align-items:center;height:var(--ts-head-h);padding:0 var(--space-8);margin:0 calc(-1 * var(--space-8));border-bottom:1px solid var(--border-default);font-size:var(--type-caption-size);line-height:var(--type-caption-lh);font-weight:600;color:var(--fg-high)}\n.ts-sort-btn{display:flex;align-items:center;gap:4px;font:inherit;color:inherit;cursor:pointer}\n.ts-sort-btn:hover{color:var(--primary-default)}\n.ts-sort-icon{display:block;flex:0 0 auto}\n.ts-col-center{display:flex;align-items:center;justify-content:flex-start}\n.ts-col-end{display:flex;align-items:center;justify-content:flex-end}\n.ts-tbl-row{display:grid;grid-template-columns:var(--ts-cols);align-items:center;min-height:var(--ts-row-h);padding:0 var(--space-8);margin:0 calc(-1 * var(--space-8));border-bottom:1px solid var(--border-default);border-radius:var(--radius-sm)}\n.ts-tbl-row:hover{background:var(--bg-highlight)}\n.ts-cell-name{display:flex;align-items:baseline;gap:8px;min-width:0;padding-right:var(--space-16)}\n.ts-name-link{font-size:var(--type-body2-size);line-height:var(--type-body2-lh);font-weight:var(--type-body2b-weight);letter-spacing:var(--type-body2-ls);color:var(--fg-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.ts-name-link:hover{text-decoration:none;color:var(--fg-high)}\n.ts-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--radius-pill);font-size:var(--type-caption-size);line-height:var(--type-caption-lh);font-weight:500;white-space:nowrap}\n.ts-badge--ok{background:var(--bg-success);color:var(--fg-success)}\n.ts-badge--pending{background:var(--bg-warning);color:var(--fg-warning)}\n.ts-join-wrap{position:relative}\n.ts-join-menu{position:absolute;top:calc(100% + 4px);right:0;z-index:101;background:var(--bg-default);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:0 4px 16px rgba(0,0,0,.12);width:220px;overflow-y:auto;max-height:calc(7 * 36px);padding:4px 0}\n.ts-join-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:0 12px;height:36px;background:transparent;border:none;cursor:pointer;font-size:var(--type-body2-size);color:var(--fg-high);white-space:nowrap}\n.ts-join-item:hover{background:var(--bg-highlight)}\n.ts-flows-panel{width:216px;flex:0 0 216px;background:var(--bg-default);border-right:1px solid var(--border-default);display:flex;flex-direction:column;overflow:hidden}\n.ts-sm-pages{display:flex;flex-direction:column;gap:1px;padding:10px 8px;border-bottom:1px solid var(--border-default);flex:0 0 auto}\n.ts-sm-page{display:flex;flex-direction:column;padding:6px 8px;border-radius:var(--radius-md);cursor:pointer}\n.ts-sm-page--active{background:var(--bg-active)}\n.ts-sm-page-name{font-size:var(--type-body2-size);font-weight:var(--type-body2b-weight);color:var(--fg-high)}\n.ts-sm-page--active .ts-sm-page-name{color:var(--primary-default)}\n.ts-sm-page-meta{font-size:var(--type-caption-size);color:var(--fg-low);margin-top:2px}\n.ts-sm-flows{flex:1;overflow-y:auto;padding:8px}\n.ts-sm-f     <sc-if value=\"{{ row.keysOff }}\"><span class=\"ts-badge ts-badge--pending\">Pending<\/span><\/sc-if>\n                <\/span>\n                <span role=\"cell\" class=\"ts-cell-csv\">\n                  <sc-if value=\"{{ row.ready }}\">\n                    <a href=\"#\" class=\"ts-download-link\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"ts-download-icon\"><path d=\"m7 10 5 5 5-5M12 15V3M4 20h16\"><\/path><\/svg>Download<\/a>\n                  <\/sc-if>\n                  <sc-if value=\"{{ row.blocked }}\">\n                    <span sc-camel-on-mouse-enter=\"{{ row.showReason }}\" sc-camel-on-mouse-leave=\"{{ row.hideReason }}\" class=\"ts-download-blocked\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"ts-download-icon\"><path d=\"m7 10 5 5 5-5M12 15V3M4 20h16\"><\/path><\/svg>Download<\/span>\n                    <sc-if value=\"{{ row.reasonOpen }}\">\n                      <span role=\"tooltip\" class=\"ts-tooltip\">{{ row.reason }}<\/span>\n                    <\/sc-if>\n                  <\/sc-if>\n                <\/span>\n              <\/div>\n            <\/sc-for>\n\n            <sc-if value=\"{{ folderEmpty }}\">\n              <p class=\"ts-empty-message\">No initiatives match your search.<\/p>\n            <\/sc-if>\n          <\/div>\n        <\/section>\n      \n\n      \n\n<\/section>\n      <\/sc-if>\n\n      <!-- SPREADMASTER ================================================ -->\n      <sc-if value=\"{{ onSpreadmaster }}\">\n      <div class=\"ts-flows-panel\">\n        <div style=\"padding:10px 12px 6px;border-bottom:1px solid var(--border-default);flex:0 0 auto\">\n          <button type=\"button\" class=\"ts-sm-back\" sc-camel-on-click=\"{{ smGoBack }}\">\n
